<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css" />
    <title>Conecta Aí</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#" class="cabecalho-link">Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <section>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://cdn.pixabay.com/photo/2025/05/05/05/03/long-tailed-tit-9579461_1280.jpg" alt="Shima Enaga" class="cartao-imagem">
                    <p>O shima enaga é um pinguim.!</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://cdn.pixabay.com/photo/2025/05/05/05/03/long-tailed-tit-9579461_1280.jpg" alt="Shima Enaga"  class="cartao-imagem">

                </div>
            </div>
        </article>
<article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMkw2vuU4-QYYpBkHiV5C1sBSPPkSI4OFDnHYN9dnLnsQcZn5Kornwv5nK&s=10" alt="Coelho" class="cartao-imagem">

                </div>
                <div class="cartao-verso">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMkw2vuU4-QYYpBkHiV5C1sBSPPkSI4OFDnHYN9dnLnsQcZn5Kornwv5nK&s=10" alt="Coelho"  class="cartao-imagem">
                    <p>Os dentes dos coelhos crescem durante toda a vida.! </p>
            </div>
        </article>

        </section>
    </main>
    <footer>
        <p>Projeto feito por Yasmim Vitória </p>
    </footer>

</html>
